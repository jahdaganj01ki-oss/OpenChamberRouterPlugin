name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm install

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Debug test failure
        if: failure()
        run: |
          echo "=== Node version ==="
          node --version
          echo "=== npm version ==="
          npm --version
          echo "=== Test files found ==="
          find test -name "*.test.*" 2>/dev/null
          echo "=== Running tests with verbose output ==="
          npm test 2>&1 || true
          echo "=== Package-lock tsx check ==="
          ls node_modules/.bin/tsx 2>/dev/null || echo "tsx not found in .bin"

  release:
    name: Publish Extension
    runs-on: windows-latest
    needs: [typecheck-and-build, test]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm install

      - name: Build (Windows)
        run: npm run build

      - name: Upload extension artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openchamber-router-extension
          path: |
            page/
            panel/
            service/
            package.json
            openchamber.patch.yml
          if-no-files-found: error
          retention-days: 30
